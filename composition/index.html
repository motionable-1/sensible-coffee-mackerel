<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrowserTest</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: transparent;
      color: #ffffff;
      font-kerning: normal;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #080a10;
    }

    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #080a10;
    }

    /* Cohesive Global Background Layer */
    .bg-universe {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, #0d1222 0%, #06080e 100%);
      overflow: hidden;
      z-index: 1;
    }

    /* Ambient soft glowing circles in corners */
    .ambient-glow-tl {
      position: absolute;
      top: -300px;
      left: -300px;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(29, 78, 216, 0.22) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    .ambient-glow-br {
      position: absolute;
      bottom: -300px;
      right: -300px;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(13, 148, 136, 0.18) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    .ambient-glow-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1000px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
      filter: blur(100px);
      pointer-events: none;
      opacity: 0.8;
    }

    /* Global layout container for scenes */
    .scene-container {
      position: absolute;
      inset: 0;
      z-index: 5;
    }

    /* SCENE 1: Title Card */
    .scene-title {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .brand-title {
      font-size: 110px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-browser {
      color: #ffffff;
      text-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
    }

    .brand-test {
      background: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 30px rgba(56, 189, 248, 0.3));
    }

    .title-flare {
      position: absolute;
      width: 480px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #38bdf8, #3b82f6, transparent);
      margin-top: 150px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
    }

    /* SCENE 2: Dashboard */
    .scene-dashboard {
      position: absolute;
      inset: 0;
      display: flex;
      background: #080a10;
    }

    /* Left Sidebar */
    .sidebar {
      width: 80px;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      background: #0c0e16;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 0;
      gap: 32px;
    }

    .sidebar-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .sidebar-icon {
      width: 20px;
      height: 20px;
      opacity: 0.4;
    }

    .sidebar-icon.active {
      opacity: 0.9;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.8));
    }

    /* Dashboard Main Area */
    .dashboard-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 50px 60px;
      gap: 36px;
    }

    /* Dashboard Header */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dashboard-title-text {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .dashboard-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #10b981;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .badge-live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    .control-dropdown {
      background: #11151e;
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.7);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
    }

    /* Hero Panel Card */
    .hero-card {
      background: #11151e;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .hero-card::after {
      content: "";
      position: absolute;
      top: 50%;
      right: 10%;
      transform: translate(50%, -50%);
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
    }

    .hero-card-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hero-card-tag {
      font-size: 14px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .hero-card-passed {
      font-size: 32px;
      font-weight: 700;
      color: #ffffff;
    }

    .hero-card-score {
      font-size: 100px;
      font-weight: 800;
      color: #10b981;
      line-height: 1;
      margin: 8px 0;
      text-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
    }

    .hero-card-desc {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.5);
    }

    .hero-card-right {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .progress-ring {
      transform: rotate(-90deg);
    }

    .progress-ring-circle-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.04);
      stroke-width: 12;
    }

    .progress-ring-circle {
      fill: none;
      stroke: #10b981;
      stroke-width: 12;
      stroke-linecap: round;
      filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.4));
    }

    .checkmark-container {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .checkmark-svg {
      width: 50px;
      height: 50px;
      fill: none;
      stroke: #10b981;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.5));
    }

    /* Bottom Row Cards */
    .dashboard-bottom-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .bottom-card {
      background: #11151e;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 160px;
    }

    .bottom-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(255, 255, 255, 0.4);
      font-size: 14px;
      font-weight: 600;
    }

    .bottom-card-value {
      font-size: 36px;
      font-weight: 700;
      color: #ffffff;
      margin-top: 8px;
    }

    .bottom-card-chart {
      height: 36px;
      margin-top: 12px;
      display: flex;
      align-items: flex-end;
    }

    /* SCENE 3: CTA Card */
    .scene-cta {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #080a10;
    }

    .cta-logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
      margin-bottom: 24px;
    }

    .cta-logo-icon {
      width: 40px;
      height: 40px;
    }

    .cta-title {
      font-size: 72px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .cta-subtitle {
      font-size: 24px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 40px;
      font-weight: 500;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      border-radius: 50px;
      padding: 16px 36px;
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 15px 30px rgba(59, 130, 246, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .cta-button-arrow {
      width: 28px;
      height: 28px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3b82f6;
    }

    .cta-button-arrow svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Utility Reveal Wrappers */
    .reveal-mask {
      overflow: hidden;
      display: inline-block;
      vertical-align: bottom;
    }

    .reveal-item {
      display: inline-block;
    }
  </style>
</head>

  <script>
    window.__timelines = window.__timelines || {};
    window.__hfThreeTime = 0;

    const timeline = gsap.timeline({ paused: true });

    // Sync React Three Fiber time loop with GSAP seek timeline
    const syncR3FTime = () => {
      const time = timeline.time();
      window.__hfThreeTime = time;
      window.dispatchEvent(new CustomEvent("hf-seek", { detail: { time } }));
    };

    timeline.eventCallback("onUpdate", syncR3FTime);
    timeline.eventCallback("onStart", syncR3FTime);
    timeline.eventCallback("onComplete", syncR3FTime);

    // Dummy anchor to force timeline evaluation across total 5 seconds
    const durationAnchor = { value: 0 };
    timeline.to(durationAnchor, {
      value: 1,
      duration: 5.0,
      ease: "none"
    }, 0);
    
    // SCENE 1 ANIMATIONS (0s - 1.5s)
    // Reveal brand text
    timeline.fromTo(".brand-browser", {
      yPercent: 100,
      opacity: 0
    }, {
      yPercent: 0,
      opacity: 1,
      duration: 0.6,
      ease: "power3.out"
    }, 0.2);

    timeline.fromTo(".brand-test", {
      yPercent: 100,
      opacity: 0
    }, {
      yPercent: 0,
      opacity: 1,
      duration: 0.6,
      ease: "power3.out"
    }, 0.3);

    // Light flare draw-in and glow pop
    timeline.fromTo(".title-flare", {
      scaleX: 0,
      opacity: 0
    }, {
      scaleX: 1,
      opacity: 1,
      duration: 0.8,
      ease: "expo.out"
    }, 0.4);

    // Scene 1 Outro (1.4s)
    timeline.to("#scene-1", {
      opacity: 0,
      y: -50,
      duration: 0.3,
      ease: "power2.in"
    }, 1.35);


    // SCENE 2 ANIMATIONS (1.5s - 3.667s)
    // Scene Entrance
    timeline.fromTo("#scene-2", {
      opacity: 0,
      y: 50,
      scale: 0.95
    }, {
      opacity: 1,
      y: 0,
      scale: 1,
      duration: 0.5,
      ease: "power3.out"
    }, 1.5);

    // Sidebar Slide in
    timeline.fromTo(".sidebar", {
      xPercent: -100
    }, {
      xPercent: 0,
      duration: 0.6,
      ease: "power3.out"
    }, 1.6);

    // Dashboard title reveal
    timeline.fromTo(".dashboard-title-item", {
      yPercent: 100
    }, {
      yPercent: 0,
      duration: 0.5,
      ease: "power3.out"
    }, 1.7);

    // Controls pop
    timeline.fromTo(".dashboard-controls > *", {
      opacity: 0,
      scale: 0.8
    }, {
      opacity: 1,
      scale: 1,
      duration: 0.4,
      stagger: 0.1,
      ease: "back.out(1.7)"
    }, 1.8);

    // Hero card reveal
    timeline.fromTo(".hero-card", {
      opacity: 0,
      y: 30
    }, {
      opacity: 1,
      y: 0,
      duration: 0.6,
      ease: "power3.out"
    }, 1.9);

    // Circle Draw and 100% Score count
    timeline.fromTo(".progress-ring-circle", {
      strokeDashoffset: 439.82
    }, {
      strokeDashoffset: 0,
      duration: 1.2,
      ease: "power2.out"
    }, 2.0);

    // Checkmark pop
    timeline.fromTo(".checkmark-svg path", {
      strokeDasharray: 50,
      strokeDashoffset: 50
    }, {
      strokeDashoffset: 0,
      duration: 0.4,
      ease: "power1.out"
    }, 2.9);

    // Score text pop
    timeline.fromTo(".hero-card-score", {
      scale: 0.5,
      opacity: 0
    }, {
      scale: 1,
      opacity: 1,
      duration: 0.5,
      ease: "elastic.out(1, 0.5)"
    }, 2.4);

    // Bottom cards stagger
    timeline.fromTo(".bottom-card", {
      opacity: 0,
      y: 20
    }, {
      opacity: 1,
      y: 0,
      duration: 0.5,
      stagger: 0.1,
      ease: "power3.out"
    }, 2.2);

    // Chart draw animations
    timeline.fromTo(".bottom-card-chart rect", {
      scaleY: 0,
      transformOrigin: "bottom"
    }, {
      scaleY: 1,
      duration: 0.6,
      stagger: 0.05,
      ease: "back.out(1.5)"
    }, 2.4);

    timeline.fromTo(".bottom-card-chart path", {
      strokeDasharray: 200,
      strokeDashoffset: 200
    }, {
      strokeDashoffset: 0,
      duration: 0.8,
      ease: "power2.out"
    }, 2.5);

    // Scene 2 Outro
    timeline.to("#scene-2", {
      opacity: 0,
      scale: 1.05,
      duration: 0.3,
      ease: "power2.in"
    }, 3.5);


    // SCENE 3 ANIMATIONS (3.667s - 5.0s)
    timeline.fromTo("#scene-3", {
      opacity: 0,
      scale: 0.95,
      y: 30
    }, {
      opacity: 1,
      scale: 1,
      y: 0,
      duration: 0.5,
      ease: "power3.out"
    }, 3.667);

    // Logo Pop
    timeline.fromTo(".cta-logo", {
      scale: 0,
      opacity: 0,
      rotation: -45
    }, {
      scale: 1,
      opacity: 1,
      rotation: 0,
      duration: 0.6,
      ease: "back.out(1.7)"
    }, 3.8);

    // CTA text and subtext reveal
    timeline.fromTo(".cta-title", {
      opacity: 0,
      y: 20
    }, {
      opacity: 1,
      y: 0,
      duration: 0.5,
      ease: "power3.out"
    }, 3.9);

    timeline.fromTo(".cta-subtitle", {
      opacity: 0,
      y: 15
    }, {
      opacity: 1,
      y: 0,
      duration: 0.5,
      ease: "power3.out"
    }, 4.0);

    // CTA Button Entrance
    timeline.fromTo(".cta-button", {
      opacity: 0,
      y: 30
    }, {
      opacity: 1,
      y: 0,
      duration: 0.6,
      ease: "back.out(1.5)"
    }, 4.15);

    timeline.fromTo(".cta-button-arrow", {
      scale: 0
    }, {
      scale: 1,
      duration: 0.4,
      ease: "back.out(1.8)"
    }, 4.45);


    window.__timelines.Main = timeline;
    syncR3FTime();
  </script>
</body>
</html>
